<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Love</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(
    135deg,
    #2b2024,
    #4b353b,
    #2b2024
  );
  overflow:hidden;
  color:white;
}

.container{
  width:90%;
  max-width:430px;
  text-align:center;
}

.card{
  background:rgba(255,255,255,.08);
  padding:18px;
  border-radius:25px;
  box-shadow:0 0 30px rgba(255,105,180,.35);
}

.card img{
  width:100%;
  height:360px;
  object-fit:cover;
  border-radius:20px;
}

.text-box{
  margin:22px auto 15px;
  background:#07050a;
  color:white;
  padding:14px 20px;
  border-radius:16px;
  border:2px solid #ff9fbd;
  box-shadow:0 0 15px #ff6fa3;
  font-size:20px;
  font-weight:bold;
}

.btn{
  border:none;
  padding:14px 38px;
  border-radius:35px;
  background:linear-gradient(135deg,#ff8bb5,#ff4f8b);
  color:white;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 20px #ff5c93;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.1);
  box-shadow:
    0 0 35px #ff4f8b,
    0 0 60px #ff5c93;
}

.btn:active{
  transform:scale(0.95);
}

/* شاشة الأغنية */
.music-box{
  display:none;
  background:rgba(255,255,255,.08);
  padding:30px 20px;
  border-radius:25px;
  border:2px solid #ff8bb5;
  box-shadow:0 0 25px #ff5c93;
}

.music-box img{
  width:170px;
  height:170px;
  object-fit:cover;
  border-radius:20px;
  margin:20px 0;
  box-shadow:0 0 25px #ff5c93;
}

.music-title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:15px;
}

.progress{
  width:85%;
  height:8px;
  background:#eee;
  border-radius:20px;
  margin:15px auto;
  overflow:hidden;
  cursor:pointer;
}

#bar{
  display:block;
  height:100%;
  width:0%;
  background:#ff5c93;
}

.time{
  display:flex;
  justify-content:space-between;
  direction:ltr;
  width:85%;
  margin:auto;
  font-size:14px;
}

.controls{
  display:flex;
  justify-content:center;
  gap:20px;
  margin:25px 0;
}

.control{
  width:58px;
  height:58px;
  border-radius:50%;
  border:none;
  background:#ff5c93;
  color:white;
  font-size:24px;
  box-shadow:0 0 20px #ff5c93;
  cursor:pointer;
  transition:0.3s;
}

.control:hover{
  transform:scale(1.2);
  box-shadow:0 0 35px #ff5c93;
}

.control:active{
  transform:scale(0.9);
}

/* القلوب المتحركة */
.heart{
  position:fixed;
  color:#ff5c93;
  font-size:35px;
  animation:float 6s linear infinite;
  opacity:.35;
  pointer-events:none;
}

@keyframes float{
  from{
    transform:translateY(100vh);
    opacity:0;
  }

  30%{
    opacity:.5;
  }

  to{
    transform:translateY(-120px);
    opacity:0;
  }
}
</style>
</head>

<body>

<audio id="music">
  <source src="song.mp4" type="audio/mp4">
  متصفحك لا يدعم تشغيل الصوت.
</audio>

<div class="heart" style="left:10%; animation-delay:0s;">❤</div>
<div class="heart" style="left:30%; animation-delay:1s;">❤</div>
<div class="heart" style="left:55%; animation-delay:2s;">❤</div>
<div class="heart" style="left:80%; animation-delay:3s;">❤</div>

<div class="container">

  <!-- الرسائل -->
  <div class="card" id="mainCard">

    <img id="photo" src="1.jpg" alt="صورة">

    <div class="text-box" id="text">
      هلو بيب
    </div>

    <button
      class="btn"
      id="buttonText"
      onclick="nextSlide()"
    >
      هلوو
    </button>

  </div>

  <!-- شاشة الأغنية -->
  <div class="music-box" id="musicBox">

    <div class="music-title">
      🎵 بوسة ماكو لشفتييي
    </div>

    <img src="6.jpg" alt="صورة الأغنية">

    <div class="progress" id="progress">
      <span id="bar"></span>
    </div>

    <div class="time">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">

      <button class="control" onclick="rewind()">
        ⏮
      </button>

      <button
        class="control"
        onclick="togglePlay()"
        id="playBtn"
      >
        ▶
      </button>

      <button class="control" onclick="forward()">
        ⏭
      </button>

    </div>

    <!-- يرجع لأول رسالة -->
    <button class="btn" onclick="restart()">
      ♡ يلا ولي ثولة
    </button>

  </div>

</div>

<script>
let index = 0;

const slides = [
  {
    img:"1.jpg",
    text:"هلو شهودات",
    btn:"هلوو"
  },
  {
    img:"2.jpg",
    text:"حيوانة عندي سؤال الج ثولة",
    btn:"ها زمال؟"
  },
  {
    img:"3.jpg",
    text:"بس مستحي أسألج إياه",
    btn:"إي دكوللل"
  },
  {
    img:"4.jpg",
    text:"تحبين عبود لو لا؟",
    btn:"ها"
  },
  {
    img:"5.jpg",
    text:"ها حيوانة تحبيني",
    btn:"لا"
  },
  {
    img:"6.jpg",
    text:"إذا تحبين علي دوسي جوة",
    btn:"انجب"
  },
  {
    img:"7.jpg",
    text:"ها حيوانة طلعتي تحبيني تفففف",
    btn:"اتفييييي"
  }
];

const photo = document.getElementById("photo");
const text = document.getElementById("text");
const buttonText = document.getElementById("buttonText");
const mainCard = document.getElementById("mainCard");
const musicBox = document.getElementById("musicBox");

const music = document.getElementById("music");
const playBtn = document.getElementById("playBtn");
const bar = document.getElementById("bar");
const current = document.getElementById("current");
const duration = document.getElementById("duration");
const progress = document.getElementById("progress");

/* الانتقال بين الرسائل */
function nextSlide(){
  index++;

  if(index < slides.length){
    showSlide(index);
  }else{
    mainCard.style.display = "none";
    musicBox.style.display = "block";
  }
}

function showSlide(slideIndex){
  photo.src = slides[slideIndex].img;
  text.textContent = slides[slideIndex].text;
  buttonText.textContent = slides[slideIndex].btn;
}

/* تشغيل وإيقاف الأغنية */
function togglePlay(){
  if(music.paused){
    music.play();
    playBtn.textContent = "⏸";
  }else{
    music.pause();
    playBtn.textContent = "▶";
  }
}

/* ترجيع 5 ثوانٍ */
function rewind(){
  music.currentTime = Math.max(
    0,
    music.currentTime - 5
  );
}

/* تقديم 5 ثوانٍ */
function forward(){
  music.currentTime = Math.min(
    music.duration || 0,
    music.currentTime + 5
  );
}

/* تحديث شريط الأغنية */
music.addEventListener("timeupdate", function(){
  if(!isNaN(music.duration) && music.duration > 0){
    const percent =
      (music.currentTime / music.duration) * 100;

    bar.style.width = percent + "%";
  }

  current.textContent = formatTime(music.currentTime);
  duration.textContent = formatTime(music.duration);
});

/* إظهار مدة الأغنية */
music.addEventListener("loadedmetadata", function(){
  duration.textContent = formatTime(music.duration);
});

/* عند انتهاء الأغنية */
music.addEventListener("ended", function(){
  playBtn.textContent = "▶";
  bar.style.width = "0%";
});

/* الضغط على شريط الأغنية */
progress.addEventListener("click", function(event){
  if(isNaN(music.duration)) return;

  const box = progress.getBoundingClientRect();
  const position = event.clientX - box.left;
  const percent = position / box.width;

  music.currentTime = percent * music.duration;
});

/* تنسيق الوقت */
function formatTime(time){
  if(isNaN(time)) return "0:00";

  const minutes = Math.floor(time / 60);
  let seconds = Math.floor(time % 60);

  if(seconds < 10){
    seconds = "0" + seconds;
  }

  return minutes + ":" + seconds;
}

/* الرجوع لأول رسالة */
function restart(){
  index = 0;

  music.pause();
  music.currentTime = 0;

  playBtn.textContent = "▶";
  bar.style.width = "0%";
  current.textContent = "0:00";

  mainCard.style.display = "block";
  musicBox.style.display = "none";

  showSlide(0);
}
</script>

</body>
</html>
